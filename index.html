<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastro360</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f5f6;
    color:#263238;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:225px;
    background:#fafafa;
    border-right:1px solid #ddd;
    z-index:20;
    transition:.25s;
}

.sidebar.collapsed{
    width:68px;
}

.logo-area{
    height:75px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    gap:10px;
    padding:15px;
}

.logo{
    width:40px;
    height:40px;
    background:#263238;
    color:white;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
}

.logo-text{
    font-size:18px;
    font-weight:bold;
}

.logo-text span{
    color:#d79b27;
}

.logo-sub{
    display:block;
    font-size:8px;
    color:#999;
    margin-top:2px;
}

.menu{
    padding:14px 8px;
}

.menu button{
    width:100%;
    height:40px;
    border:0;
    background:transparent;
    color:#626b71;
    display:flex;
    align-items:center;
    gap:11px;
    padding:0 12px;
    border-radius:4px;
    cursor:pointer;
    font-size:11px;
    text-align:left;
}

.menu button:hover{
    background:#e9eaeb;
}

.menu button.active{
    background:#dedfe0;
    color:#263238;
    font-weight:bold;
    border-left:3px solid #d79b27;
}

.icon{
    width:20px;
    text-align:center;
    font-size:15px;
}

.sidebar.collapsed .logo-text,
.sidebar.collapsed .menu span:not(.icon){
    display:none;
}

.sidebar.collapsed .menu button{
    justify-content:center;
}

.toggle{
    position:absolute;
    right:-13px;
    top:83px;
    width:27px;
    height:27px;
    border-radius:50%;
    border:1px solid #ccc;
    background:white;
    cursor:pointer;
}

/* ================= MAIN ================= */

.main{
    margin-left:225px;
    min-height:100vh;
    transition:.25s;
}

.sidebar.collapsed ~ .main{
    margin-left:68px;
}

/* ================= TOP ================= */

.topbar{
    height:65px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:10;
}

.search{
    width:320px;
    background:#f5f6f6;
    border:1px solid #ddd;
    border-radius:5px;
    padding:9px 12px;
}

.search input{
    width:90%;
    border:0;
    outline:0;
    background:transparent;
    font-size:11px;
}

.user{
    font-size:10px;
}

.avatar{
    display:inline-flex;
    width:32px;
    height:32px;
    border-radius:50%;
    background:#e5e8e9;
    align-items:center;
    justify-content:center;
    margin-right:7px;
    font-weight:bold;
}

/* ================= CONTENT ================= */

.content{
    padding:25px;
    max-width:1600px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-bottom:18px;
}

.eyebrow{
    font-size:8px;
    color:#92999d;
    letter-spacing:1.2px;
    font-weight:bold;
}

h1{
    margin:0;
    font-size:26px;
}

.subtitle{
    color:#8b9297;
    font-size:10px;
    margin-top:5px;
}

.actions{
    display:flex;
    gap:7px;
}

button.primary,
button.secondary{
    border:0;
    border-radius:4px;
    padding:9px 13px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#263238;
    color:white;
}

.secondary{
    background:#e7e9ea;
    color:#465057;
}

/* ================= KPI ================= */

.kpis{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:13px;
}

.kpi{
    background:white;
    border:1px solid #ddd;
    border-radius:5px;
    padding:13px;
}

.kpi-title{
    font-size:8px;
    color:#858d92;
}

.kpi-value{
    font-size:20px;
    font-weight:bold;
    margin-top:5px;
}

.kpi-change{
    font-size:8px;
    color:#4d805c;
    margin-top:6px;
}

/* ================= DASHBOARD ================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:1.45fr 1fr;
    gap:13px;
    margin-bottom:13px;
}

.card{
    background:white;
    border:1px solid #ddd;
    border-radius:5px;
    padding:15px;
}

.card-title{
    font-size:12px;
    font-weight:bold;
}

.card-sub{
    font-size:8px;
    color:#999;
    margin-top:3px;
}

/* CHART */

.chart{
    height:210px;
    display:flex;
    align-items:end;
    gap:13px;
    padding:15px 10px 5px;
}

.bar-group{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:end;
    align-items:center;
    gap:5px;
}

.bar{
    width:60%;
    max-width:45px;
    background:#7daeb5;
    border-radius:3px 3px 0 0;
}

.bar-label{
    font-size:8px;
    color:#888;
}

/* LINE */

.line-chart{
    height:210px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.line{
    width:90%;
    height:140px;
}

/* ================= LOWER PANELS ================= */

.lower{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

/* ================= TABLE ================= */

.table{
    margin-top:12px;
    overflow:auto;
}

.table-row{
    display:grid;
    grid-template-columns:1.5fr .8fr .8fr .8fr .8fr;
    min-width:650px;
    padding:9px 4px;
    border-top:1px solid #eee;
    font-size:9px;
}

.table-header{
    color:#999;
    font-size:8px;
    border-top:0;
}

.badge{
    display:inline-block;
    padding:3px 6px;
    border-radius:12px;
    font-size:7px;
}

.badge-ok{
    background:#e5f0e8;
    color:#497456;
}

.badge-low{
    background:#f5e4e2;
    color:#a54b43;
}

/* ================= SALES ================= */

.filters{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:7px;
    margin-top:13px;
}

.filter label{
    display:block;
    font-size:8px;
    color:#697278;
    font-weight:bold;
    margin-bottom:4px;
}

.filter input,
.filter select{
    width:100%;
    height:33px;
    border:1px solid #ddd;
    border-radius:4px;
    background:white;
    padding:6px;
    font-size:9px;
}

.periods{
    display:flex;
    gap:5px;
    margin-top:12px;
    flex-wrap:wrap;
}

.periods button{
    border:1px solid #ddd;
    background:white;
    border-radius:4px;
    padding:6px 9px;
    font-size:8px;
    cursor:pointer;
}

.periods button.active{
    background:#263238;
    color:white;
}

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin:13px 0;
}

.summary-box{
    background:white;
    border:1px solid #ddd;
    padding:12px;
    border-radius:5px;
}

.summary-box small{
    color:#888;
    font-size:8px;
}

.summary-box strong{
    display:block;
    font-size:17px;
    margin-top:4px;
}

/* ================= MODAL ================= */

.modal-bg{
    position:fixed;
    inset:0;
    background:#0008;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.modal-bg.show{
    display:flex;
}

.modal{
    background:white;
    width:700px;
    max-width:95%;
    max-height:90vh;
    overflow:auto;
    border-radius:7px;
}

.modal-header{
    padding:15px;
    border-bottom:1px solid #ddd;
    display:flex;
    justify-content:space-between;
}

.modal-header h2{
    margin:0;
    font-size:15px;
}

.modal-body{
    padding:15px;
}

.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.form label{
    font-size:8px;
    color:#666;
    font-weight:bold;
}

.form input,
.form select{
    width:100%;
    height:35px;
    margin-top:4px;
    border:1px solid #ddd;
    border-radius:4px;
    padding:6px;
}

.modal-footer{
    padding:12px 15px;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:flex-end;
    gap:7px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){
    .kpis{
        grid-template-columns:repeat(3,1fr);
    }

    .filters{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:750px){
    .sidebar{
        width:68px;
    }

    .logo-text,
    .menu span:not(.icon){
        display:none;
    }

    .menu button{
        justify-content:center;
    }

    .main{
        margin-left:68px;
    }

    .content{
        padding:15px;
    }

    .topbar{
        padding:0 12px;
    }

    .search{
        display:none;
    }

    .kpis{
        grid-template-columns:1fr 1fr;
    }

    .dashboard-grid,
    .lower{
        grid-template-columns:1fr;
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }

    .summary{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar" id="sidebar">

<div class="logo-area">
    <div class="logo">G</div>
    <div class="logo-text">
        Gastro<span>360</span>

<!-- ================= MAIN ================= -->

<!-- ================= MODAL VENTA ================= -->

<div class="modal-bg" id="modal">

<div class="modal">

<div class="modal-body">

<div class="form">

Mesa
<select id="mesa">

<option>Mesa 08</option>

</select>
</label>

<label>
Mesero
<select id="mesero">
<option>Andrea López</option>
<option>Marco Díaz</option>
<option>Sofía Ramírez</option>

Forma de pago

<button class="primary" onclick="saveSale()">Registrar venta</button>
</div>

</div>
</div>


<script>

function money(n){
return n.toLocaleString("es-MX",{
style:"currency",
currency:"MXN"
});
}

/* ================= MENU ================= */

function buildMenu(){

document.getElementById("menu").innerHTML=

modules.map(m=>`

<button
class="${activeModule===m[0]?"active":""}"
onclick="activeModule='${m[0]}';buildMenu();render()">

<span class="icon">${m[1]}</span>
<span>${m[0]}</span>

</button>

`).join("");

}

/* ================= SIDEBAR ================= */

function toggleSidebar(){

document
.getElementById("sidebar")
.classList.toggle("collapsed");

}

/* ================= KPI ================= */

function kpi(title,value,change){

return `

<div class="kpi">

<div class="kpi-title">${title}</div>

<div class="kpi-value">${value}</div>

<div class="kpi-change">${change}</div>

</div>

}

/* ================= NUEVA VENTA ================= */

function openSale(){

document.getElementById("modal").classList.add("show");

document.getElementById("products").innerHTML=

products.slice(0,5).map((p,i)=>`

<div style="
display:grid;
grid-template-columns:1fr 80px;
gap:10px;
padding:8px 0;
border-bottom:1px solid #eee;
font-size:10px;
">

<div>
<b>${p[0]}</b>
<br>
<small>${money(p[1])}</small>
</div>

<input
type="number"
min="0"
value="${i===0?2:1}"
data-price="${p[1]}"
style="
height:30px;
border:1px solid #ddd;
border-radius:4px;
padding:5px;
"
oninput="calculateSale()">

</div>

`).join("");

calculateSale();

}

function closeSale(){

document.getElementById("modal").classList.remove("show");

}

function calculateSale(){

let subtotal=0;

document.querySelectorAll("#products input").forEach(input=>{

subtotal+=
Number(input.value||0)*
Number(input.dataset.price||0);

});

let iva=subtotal*.16;
let total=subtotal+iva;

document.getElementById("subtotal").textContent=money(subtotal);
document.getElementById("iva").textContent=money(iva);
document.getElementById("total").textContent=money(total);

}

function saveSale(){

let subtotal=0;
let quantity=0;

document.querySelectorAll("#products input").forEach(input=>{

let q=Number(input.value||0);

quantity+=q;

subtotal+=q*Number(input.dataset.price);

});

let iva=subtotal*.16;
let total=subtotal+iva;

let folio="V-"+(1043+sales.length);

sales.unshift([
folio,
"30/08/2026",
new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}),
document.getElementById("mesa").value,
document.getElementById("mesero").value,
quantity,
subtotal,
0,
iva,
total,
document.getElementById("pago").value
]);

closeSale();

render();

alert(
"Venta "+folio+
" registrada correctamente.\n"+
"Total: "+money(total)
);

}
