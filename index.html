<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastro360 | Control Gastronómico Premium</title>

<style>
:root{
    --bg:#181b1d;
    --panel:#222629;
    --panel2:#292e31;
    --line:#383e42;
    --text:#f2f3f3;
    --muted:#9ca3a7;
    --gold:#c9a15b;
    --gold2:#e0bd78;
    --green:#62b27b;
    --red:#d66a62;
    --blue:#69aab5;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    overflow-x:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:235px;
    background:#151719;
    border-right:1px solid var(--line);
    z-index:20;
    transition:.25s;
    overflow-y:auto;
}

.sidebar.collapsed{
    width:72px;
}

.brand{
    height:82px;
    padding:14px 17px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:11px;
}

.brandmark{
    width:45px;
    height:45px;
    border:2px solid var(--gold);
    border-radius:9px;
    display:grid;
    place-items:center;
    color:var(--gold);
    font-size:22px;
    font-weight:800;
    flex-shrink:0;
}

.brandname{
    font-size:20px;
    font-weight:800;
    letter-spacing:-.5px;
}

.brandname span{
    color:var(--gold);
}

.brand small{
    display:block;
    color:var(--muted);
    font-size:7px;
    letter-spacing:1.5px;
    margin-top:3px;
}

.toggle{
    position:absolute;
    right:-14px;
    top:92px;
    width:28px;
    height:28px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    transition:.2s;
}

.toggle:hover{
    background:var(--gold);
    color:#181b1d;
}

.nav{
    padding:14px 9px;
}

.nav button{
    width:100%;
    height:40px;
    border:0;
    background:transparent;
    color:#aeb4b7;
    text-align:left;
    border-radius:6px;
    padding:0 12px;
    display:flex;
    align-items:center;
    gap:11px;
    font-size:11px;
    cursor:pointer;
    margin:2px 0;
    transition:.2s;
    font-weight:500;
}

.nav button:hover{
    background:#2a2f32;
    color:white;
}

.nav button.active{
    background:#2a2f32;
    color:var(--gold2);
    border-left:3px solid var(--gold);
    padding-left:9px;
    font-weight:600;
}

.ico{
    width:21px;
    text-align:center;
    font-size:15px;
    flex-shrink:0;
}

.sidebar.collapsed .brandname,
.sidebar.collapsed .nav span:not(.ico){
    display:none;
}

.sidebar.collapsed .nav button{
    justify-content:center;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:235px;
    min-height:100vh;
    transition:.25s;
}

.sidebar.collapsed ~ .main{
    margin-left:72px;
}

/* =========================
   TOPBAR
========================= */

.top{
    height:70px;
    border-bottom:1px solid var(--line);
    background:#1c1f21;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:10;
}

.search{
    width:340px;
    height:36px;
    border:1px solid var(--line);
    background:#24282a;
    border-radius:6px;
    padding:0 12px;
    color:#aaa;
    display:flex;
    align-items:center;
    gap:7px;
    transition:.2s;
}

.search:focus-within{
    border-color:var(--gold);
    background:#2a2f32;
}

.search input{
    border:0;
    outline:0;
    background:none;
    color:white;
    width:100%;
    font-size:11px;
}

.search input::placeholder{
    color:#666;
}

.topright{
    display:flex;
    align-items:center;
    gap:15px;
    color:#bbb;
    font-size:10px;
}

.avatar{
    width:33px;
    height:33px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--gold), var(--gold2));
    display:grid;
    place-items:center;
    color:#181b1d;
    font-weight:700;
    font-size:12px;
}

/* =========================
   CONTENT
========================= */

.content{
    padding:28px;
    max-width:1700px;
    margin:auto;
}

.head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-bottom:18px;
}

.eyebrow{
    font-size:8px;
    letter-spacing:1.6px;
    color:var(--gold);
    font-weight:700;
    margin-bottom:6px;
}

h1{
    font-size:30px;
    line-height:1;
    margin:0;
}

.sub{
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
}

.date{
    font-size:10px;
    color:#aaa;
}

/* =========================
   SECTIONS
========================= */

.section{
    margin-top:20px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px;
}

.section-title h2{
    font-size:13px;
    margin:0;
    font-weight:600;
}

.section-title span{
    font-size:9px;
    color:var(--muted);
}

/* =========================
   KPI
========================= */

.kpis{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.kpi{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:7px;
    padding:15px;
    transition:.2s;
}

.kpi:hover{
    border-color:var(--gold);
    background:var(--panel2);
}

.kpi label{
    font-size:9px;
    color:var(--muted);
    font-weight:500;
}

.kpi strong{
    display:block;
    font-size:23px;
    margin-top:7px;
    color:var(--gold2);
    font-weight:700;
}

.trend{
    font-size:9px;
    color:var(--green);
    margin-top:6px;
    font-weight:500;
}

.trend.down{
    color:var(--red);
}

/* =========================
   MONTH
========================= */

.month{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.month .kpi{
    background:#202426;
}

/* =========================
   TARGETS
========================= */

.targets{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.target{
    padding:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:7px;
    transition:.2s;
}

.target:hover{
    border-color:var(--gold);
}

.target-top{
    display:flex;
    justify-content:space-between;
    font-size:9px;
    color:var(--muted);
}

.target strong{
    display:block;
    font-size:17px;
    margin:8px 0 4px;
    color:var(--gold2);
    font-weight:700;
}

.progress{
    height:6px;
    background:#343a3d;
    border-radius:10px;
    overflow:hidden;
}

.progress i{
    display:block;
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--gold2));
    border-radius:10px;
    transition:.3s;
}

.target small{
    display:block;
    margin-top:7px;
    color:#aaa;
    font-size:8px;
}

/* =========================
   CARDS
========================= */

.card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:7px;
    padding:15px;
}

.card h3{
    font-size:13px;
    margin:0;
    font-weight:600;
}

.card p{
    font-size:9px;
    color:var(--muted);
    margin:5px 0 12px;
}

/* =========================
   INVENTORY
========================= */

.invgrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.mini{
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:11px;
    transition:.2s;
}

.mini:hover{
    border-color:var(--gold);
}

.mini label{
    font-size:8px;
    color:var(--muted);
    font-weight:500;
}

.mini strong{
    display:block;
    font-size:17px;
    margin-top:5px;
    font-weight:700;
}

.ok{
    color:var(--green);
}

.risk{
    color:var(--red);
}

/* =========================
   TABLE
========================= */

.table{
    margin-top:10px;
    overflow:auto;
}

.row{
    display:grid;
    grid-template-columns:1.5fr .8fr .8fr .8fr;
    gap:8px;
    padding:9px 2px;
    border-top:1px solid #33383b;
    font-size:9px;
    transition:.2s;
}

.row:hover{
    background:#2a2f32;
    border-radius:4px;
}

.row.header{
    border-top:0;
    color:var(--muted);
    font-size:8px;
    font-weight:600;
    background:#1a1d1f;
    padding:12px 2px;
}

.row small{
    display:block;
    color:#858d91;
    font-size:7px;
    margin-top:3px;
}

.badge{
    display:inline-block;
    border-radius:12px;
    padding:3px 6px;
    font-size:7px;
    font-weight:600;
}

.bgreen{
    background:#23392b;
    color:#7bc48e;
}

.bred{
    background:#422827;
    color:#e48b83;
}

.bblue{
    background:#23344a;
    color:#78b5d6;
}

.byellow{
    background:#4a4023;
    color:#d4a574;
}

/* =========================
   LIVE BUSINESS
========================= */

.live{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.livebox{
    padding:12px;
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:6px;
    transition:.2s;
}

.livebox:hover{
    border-color:var(--gold);
}

.livebox label{
    font-size:8px;
    color:var(--muted);
    font-weight:500;
}

.livebox strong{
    display:block;
    font-size:20px;
    margin-top:5px;
    color:var(--gold2);
    font-weight:700;
}

.staff{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:9px;
}

.person{
    background:#33393c;
    border-radius:20px;
    padding:6px 9px;
    font-size:8px;
    border:1px solid var(--line);
    transition:.2s;
}

.person:hover{
    background:var(--gold);
    color:#181b1d;
}

.alerts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.alert{
    padding:10px;
    background:#292728;
    border-left:3px solid var(--gold);
    border-radius:4px;
    font-size:9px;
    line-height:1.5;
    animation:slideIn .3s ease-out;
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateX(-20px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.alert.red{
    border-left-color:var(--red);
}

.alert.green{
    border-left-color:var(--green);
}

.alert.blue{
    border-left-color:var(--blue);
}

/* =========================
   GASTROIA FLOTANTE
========================= */

.ai{
    position:fixed;
    right:25px;
    bottom:25px;
    z-index:50;
}

.ai-btn{
    width:62px;
    height:62px;
    border-radius:50%;
    border:2px solid var(--gold);
    background:linear-gradient(135deg, #24282a, #2a2f32);
    color:var(--gold);
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
    cursor:pointer;
    font-weight:800;
    font-size:20px;
    position:relative;
    transition:.3s;
}

.ai-btn:hover{
    transform:scale(1.1);
    box-shadow:0 12px 40px rgba(201,161,91,0.3);
}

.dot{
    position:absolute;
    right:2px;
    top:1px;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--red);
    border:2px solid #24282a;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.5;}
}

.ai-panel{
    position:absolute;
    right:0;
    bottom:74px;
    width:330px;
    background:#202426;
    border:1px solid var(--line);
    border-radius:9px;
    box-shadow:0 15px 45px rgba(0,0,0,0.6);
    display:none;
    overflow:hidden;
    flex-direction:column;
    max-height:400px;
}

.ai-panel.show{
    display:flex;
    animation:slideUp .3s ease-out;
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.ai-head{
    padding:13px 15px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
}

.ai-head strong{
    color:var(--gold2);
    font-weight:700;
}

.ai-body{
    padding:14px;
    font-size:10px;
    line-height:1.6;
    max-height:250px;
    overflow-y:auto;
    flex:1;
}

.ai-msg{
    padding:9px;
    background:#292e31;
    border-radius:6px;
    margin-bottom:7px;
    border-left:2px solid var(--gold);
}

.ai-msg.user{
    background:var(--gold);
    color:#181b1d;
    border-left-color:var(--gold2);
    font-weight:500;
}

.ai-input{
    display:flex;
    gap:6px;
    padding:10px;
    border-top:1px solid var(--line);
    flex-shrink:0;
}

.ai-input input{
    flex:1;
    background:#16191a;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
    color:white;
    font-size:9px;
    transition:.2s;
}

.ai-input input:focus{
    outline:none;
    border-color:var(--gold);
}

.ai-input button{
    background:var(--gold);
    border:0;
    border-radius:5px;
    padding:0 12px;
    font-size:9px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.ai-input button:hover{
    background:var(--gold2);
}

/* =========================
   BOTONES
========================= */

.btn{
    border:0;
    border-radius:5px;
    padding:8px 12px;
    font-size:9px;
    cursor:pointer;
    transition:.2s;
    font-weight:600;
}

.btn.dark{
    background:#33393c;
    color:white;
}

.btn.dark:hover{
    background:#3f454a;
}

.btn.gold{
    background:var(--gold);
    color:#17191a;
    font-weight:700;
}

.btn.gold:hover{
    background:var(--gold2);
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(201,161,91,0.3);
}

.btn.red{
    background:var(--red);
    color:white;
}

.btn.red:hover{
    background:#e07a72;
}

.btn.green{
    background:var(--green);
    color:white;
}

.btn.green:hover{
    background:#73c48b;
}

/* =========================
   VENTAS
========================= */

.filters{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
}

.filter{
    display:flex;
    flex-direction:column;
}

.filter label{
    display:block;
    font-size:8px;
    color:var(--muted);
    margin-bottom:4px;
    font-weight:500;
}

.filter input,
.filter select{
    width:100%;
    height:34px;
    background:#1a1d1f;
    border:1px solid var(--line);
    border-radius:5px;
    color:#eee;
    padding:6px 8px;
    font-size:9px;
    transition:.2s;
}

.filter input:focus,
.filter select:focus{
    outline:none;
    border-color:var(--gold);
    background:#202426;
}

.periods{
    display:flex;
    gap:5px;
    margin-top:10px;
    flex-wrap:wrap;
}

.periods button{
    border:1px solid var(--line);
    background:#1a1d1f;
    color:#bbb;
    border-radius:4px;
    padding:6px 9px;
    font-size:8px;
    cursor:pointer;
    transition:.2s;
    font-weight:500;
}

.periods button:hover{
    border-color:var(--gold);
    color:var(--gold);
}

.periods button.active{
    background:var(--gold);
    color:#181b1d;
    border-color:var(--gold);
    font-weight:700;
}

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin:10px 0;
}

/* =========================
   MODAL
========================= */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    backdrop-filter:blur(2px);
}

.modal-bg.show{
    display:flex;
    animation:fadeIn .2s ease-out;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

.modal{
    width:700px;
    max-width:94%;
    background:#202426;
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 20px 60px rgba(0,0,0,0.8);
    animation:modalSlide .3s ease-out;
}

@keyframes modalSlide{
    from{
        opacity:0;
        transform:scale(0.95);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.mh{
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.mh h2{
    font-size:15px;
    margin:0;
    font-weight:700;
}

.mb{
    padding:16px;
    max-height:60vh;
    overflow-y:auto;
}

.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.form label{
    font-size:8px;
    color:var(--muted);
    font-weight:500;
}

.form input,
.form select,
.form textarea{
    width:100%;
    margin-top:4px;
    height:35px;
    background:#171a1c;
    border:1px solid var(--line);
    color:white;
    border-radius:5px;
    padding:6px 8px;
    font-size:9px;
    transition:.2s;
}

.form textarea{
    height:60px;
    resize:vertical;
}

.form input:focus,
.form select:focus,
.form textarea:focus{
    outline:none;
    border-color:var(--gold);
    background:#1a1d1f;
}

.form.full{
    grid-template-columns:1fr;
}

.mf{
    display:flex;
    justify-content:flex-end;
    gap:7px;
    padding:12px 16px;
    border-top:1px solid var(--line);
}

.success-message{
    padding:12px 16px;
    background:#23392b;
    border-left:3px solid var(--green);
    border-radius:4px;
    color:var(--green);
    font-size:9px;
    margin-bottom:10px;
    animation:slideIn .3s ease-out;
}

.error-message{
    padding:12px 16px;
    background:#422827;
    border-left:3px solid var(--red);
    border-radius:4px;
    color:var(--red);
    font-size:9px;
    margin-bottom:10px;
    animation:slideIn .3s ease-out;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){
    .kpis,
    .month,
    .targets{
        grid-template-columns:repeat(3,1fr);
    }

    .filters{
        grid-template-columns:repeat(3,1fr);
    }

    .live{
        grid-template-columns:repeat(2,1fr);
    }

    .invgrid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:750px){
    .sidebar{
        width:72px;
    }

    .brandname,
    .nav span:not(.ico){
        display:none;
    }

    .nav button{
        justify-content:center;
    }

    .main{
        margin-left:72px;
    }

    .content{
        padding:16px;
    }

    .top{
        padding:0 14px;
    }

    .search{
        width:190px;
    }

    .kpis,
    .month,
    .targets{
        grid-template-columns:1fr 1fr;
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }

    .summary{
        grid-template-columns:1fr 1fr;
    }

    .alerts{
        grid-template-columns:1fr;
    }

    .live{
        grid-template-columns:1fr;
    }

    .invgrid{
        grid-template-columns:1fr;
    }

    .form{
        grid-template-columns:1fr;
    }

    .modal{
        width:90%;
    }

    .row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- ==================================
     MENÚ LATERAL
================================== -->

<aside class="sidebar" id="sidebar">
    <div class="brand">
        <div class="brandmark">G</div>
        <div class="brandname">
            Gastro<span>360</span>
            <small>PREMIUM</small>
        </div>
    </div>

    <button class="toggle" id="toggleBtn" title="Contraer menú">☰</button>

    <nav class="nav" id="nav"></nav>
</aside>


<!-- ==================================
     CONTENIDO PRINCIPAL
================================== -->

<main class="main">

<header class="top">
    <div class="search">
        ⌕
        <input
            id="globalSearch"
            placeholder="Buscar en Gastro360..."
            onkeydown="handleGlobalSearch(event)">
    </div>

    <div class="topright">
        <span>● Sistema operativo</span>
        <span class="avatar" id="avatarUser" title="Administrador">ER</span>
        <span id="userRole">Administrador</span>
    </div>
</header>

<section class="content" id="app"></section>

</main>


<!-- ==================================
     GASTROIA FLOTANTE
================================== -->

<div class="ai">
    <div class="ai-panel" id="aiPanel">
        <div class="ai-head">
            <strong>GastroIA</strong>
            <button class="btn dark" id="closeAIBtn" title="Cerrar GastroIA">×</button>
        </div>

        <div class="ai-body" id="aiBody">
            <div class="ai-msg">
                <b>Bienvenida:</b><br>
                Estoy aquí para ayudarte a optimizar tu negocio gastronómico.
            </div>
        </div>

        <div class="ai-input">
            <input
                id="aiInput"
                placeholder="Pregúntale a GastroIA..."
                onkeydown="handleAIKeydown(event)">
            <button id="sendAIBtn" title="Enviar mensaje">Enviar</button>
        </div>
    </div>

    <button class="ai-btn" id="aiBtn" title="Abrir GastroIA">
        G
        <span class="dot"></span>
    </button>
</div>


<!-- ==================================
     MODAL NUEVA VENTA
================================== -->

<div class="modal-bg" id="modalVenta">
    <div class="modal">
        <div class="mh">
            <h2>Nueva operación · Venta</h2>
            <button class="btn dark" id="closeVentaModal" title="Cerrar">×</button>
        </div>

        <div class="mb">
            <div id="ventaMessage"></div>
            <div class="form">
                <label>
                    Mesa
                    <select id="mesa">
                        <option>Mesa 01</option>
                        <option>Mesa 04</option>
                        <option>Mesa 08</option>
                        <option>Mesa 12</option>
                        <option>Barra 02</option>
                    </select>
                </label>

                <label>
                    Mesero
                    <select id="mesero">
                        <option>Andrea López</option>
                        <option>Marco Díaz</option>
                        <option>Sofía Ramírez</option>
                        <option>Daniel Pérez</option>
                    </select>
                </label>

                <label>
                    Forma de pago
                    <select id="pago">
                        <option>Tarjeta</option>
                        <option>Efectivo</option>
                        <option>Transferencia</option>
                    </select>
                </label>

                <label>
                    Importe
                    <input id="importe" type="number" step="0.01" value="850" min="0">
                </label>
            </div>
        </div>

        <div class="mf">
            <button class="btn dark" id="cancelVentaBtn">Cancelar</button>
            <button class="btn gold" id="saveVentaBtn">Registrar venta</button>
        </div>
    </div>
</div>


<!-- ==================================
     MODAL NUEVA COMANDA
================================== -->

<div class="modal-bg" id="modalComanda">
    <div class="modal">
        <div class="mh">
            <h2>Nueva comanda</h2>
            <button class="btn dark" id="closeComandaModal" title="Cerrar">×</button>
        </div>

        <div class="mb">
            <div id="comandaMessage"></div>
            <div class="form">
                <label>
                    Mesa
                    <select id="comMesa">
                        <option>Mesa 01</option>
                        <option>Mesa 04</option>
                        <option>Mesa 08</option>
                        <option>Mesa 12</option>
                    </select>
                </label>

                <label>
                    Área
                    <select id="comArea">
                        <option>Cocina</option>
                        <option>Barra</option>
                    </select>
                </label>

                <label class="form-full">
                    Descripción
                    <textarea id="comDescripcion" placeholder="Detalle de la comanda..."></textarea>
                </label>

                <label>
                    Prioridad
                    <select id="comPriority">
                        <option>Normal</option>
                        <option>Alta</option>
                        <option>Baja</option>
                    </select>
                </label>
            </div>
        </div>

        <div class="mf">
            <button class="btn dark" id="cancelComandaBtn">Cancelar</button>
            <button class="btn gold" id="saveComandaBtn">Crear comanda</button>
        </div>
    </div>
</div>


<!-- ==================================
     MODAL MOVIMIENTO INVENTARIO
================================== -->

<div class="modal-bg" id="modalInventario">
    <div class="modal">
        <div class="mh">
            <h2>Movimiento de inventario</h2>
            <button class="btn dark" id="closeInventarioModal" title="Cerrar">×</button>
        </div>

        <div class="mb">
            <div id="inventarioMessage"></div>
            <div class="form">
                <label>
                    Producto
                    <select id="invProducto">
                        <option>Cerveza Corona</option>
                        <option>Cerveza Victoria</option>
                        <option>Tequila Blanco</option>
                        <option>Limón</option>
                        <option>Sal</option>
                    </select>
                </label>

                <label>
                    Tipo de movimiento
                    <select id="invTipo">
                        <option>Entrada</option>
                        <option>Salida</option>
                    </select>
                </label>

                <label>
                    Cantidad
                    <input id="invCantidad" type="number" step="1" value="1" min="1">
                </label>

                <label>
                    Motivo
                    <select id="invMotivo">
                        <option>Compra</option>
                        <option>Uso</option>
                        <option>Devolución</option>
                        <option>Ajuste</option>
                    </select>
                </label>
            </div>
        </div>

        <div class="mf">
            <button class="btn dark" id="cancelInventarioBtn">Cancelar</button>
            <button class="btn gold" id="saveInventarioBtn">Registrar movimiento</button>
        </div>
    </div>
</div>


<script src="app.js"></script>

</body>
</html>
